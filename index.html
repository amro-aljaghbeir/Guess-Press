<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess Press - Trivia Party</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="scoreboard" id="scoreboard">
      <div class="scoreboard__team" data-team="0">
        <div class="team__header">
          <span class="team__name" id="teamAName">Team A</span>
          <span class="team__active" id="teamAActive">ACTIVE</span>
        </div>
        <div class="team__score" id="teamAScore">0</div>
        <div class="team__controls">
          <button class="score-btn" data-action="add" data-team="0">+</button>
          <button class="score-btn" data-action="sub" data-team="0">-</button>
        </div>
      </div>
      <div class="scoreboard__center">
        <div class="mode-indicator" id="modeIndicator">Mode: --</div>
        <div class="round-indicator" id="roundIndicator">Round: --</div>
        <div class="difficulty-indicator" id="difficultyIndicator">Difficulty: --</div>
      </div>
      <div class="scoreboard__team" data-team="1">
        <div class="team__header">
          <span class="team__name" id="teamBName">Team B</span>
          <span class="team__active" id="teamBActive">ACTIVE</span>
        </div>
        <div class="team__score" id="teamBScore">0</div>
        <div class="team__controls">
          <button class="score-btn" data-action="add" data-team="1">+</button>
          <button class="score-btn" data-action="sub" data-team="1">-</button>
        </div>
      </div>
    </header>

    <main class="screen" id="screenRoot"></main>

    <footer class="app-footer">
      <button class="ghost-btn" id="rulesBtn">Rules</button>
      <button class="ghost-btn" id="newGameBtn">New Game</button>
      <button class="ghost-btn" id="backToStartBtn">Back to Start</button>
    </footer>
  </div>

  <div class="modal hidden" id="modal">
    <div class="modal__content" id="modalContent"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
